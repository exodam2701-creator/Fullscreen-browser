
name: Build Fullscreen Browser APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Setup Android SDK
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extract project
        run: unzip -o FullscreenBrowser-Android-Project.zip -d .

      - name: Build APK
        run: gradle -p FullscreenBrowser assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Fullscreen-Browser-APK
          path: FullscreenBrowser/app/build/outputs/apk/debug/app-debug.apk

