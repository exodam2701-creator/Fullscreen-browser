
name: Build Fullscreen Browser APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'FullscreenBrowser-Android-Project.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        run: |
          wget https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle-8.9-bin.zip -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Extract project
        run: unzip -q FullscreenBrowser-Android-Project.zip -d .

      - name: Build APK
        run: gradle -p FullscreenBrowser assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Fullscreen-Browser-APK
          path: FullscreenBrowser/app/build/outputs/apk/debug/app-debug.apk
